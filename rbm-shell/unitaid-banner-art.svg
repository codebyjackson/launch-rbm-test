  <polygon points="127,0 640,0 640,162 483,162" fill="#75D8F7"/>
  <polygon points="503,0 640,0 640,62" fill="#ACE8FA"/>
  <g clip-path="url(#motif)" stroke="#0145CC" fill="none">
    <line x1="150" y1="170" x2="333" y2="0" stroke-width="2.00"/>
    <line x1="179" y1="170" x2="362" y2="0" stroke-width="2.21"/>
