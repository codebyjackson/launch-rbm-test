<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 162" width="640" height="162">
  <!-- Unitaid brand graphic for the banner of iframe-test.html, redrawn from the
       feedback screenshot (19 Oct 2026): a Sky Blue shape (#75D8F7), its official
       60% tint (#ACE8FA), and the line motif in a deeper tone of Unitaid Blue,
       contained in one shape and thickening toward the corner. Both edges rise
       1 in 2.2, as in the screenshot. -->
