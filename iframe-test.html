<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malaria Product Launch Dashboard — iframe test in a mock RBM platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Roboto:wght@400;500;700&display=swap">
<!--
  Iframe test. A mock of the RBM platform shell (dashboards.endmalaria.org),
  built from its design guidelines and live markup (7 Oct 2026): dark sidebar,
  blue logo bar, transparent header over the photo hero, language switch top
  right. Only the LAUNCH entry works; RBM's own sections are greyed out, and so
  are Pipeline and Story until they are built for RBM. The language switch
  loads en/, fr/, pt/ or es/ into the iframe, as RBM's /en, /fr and /pt routes
  will (RBM has no /es route yet; Spanish is ours, ahead of the platform).
  Logos and hero photo in rbm-shell/ are RBM's and UNOPS's own files, copied
  for this test only.
-->
<style>
  :root {
    --rbm-blue: #2563EB; --rbm-green: #7DD865; --sidebar: #1E293B; --canvas: #EDF2F9;
    --slate-500: #64748B; --active: #0458F8; --new: #FACC15;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--canvas); color: #111827; font: 14px/1.5 Roboto, "Helvetica Neue", Arial, sans-serif; }
  button, input, select { font: inherit; }

  .app { display: flex; min-height: 100vh; }

  /* ---------- sidebar (270 px, collapses to 60 px) ---------- */
  .side {
    flex: none; width: 270px; position: sticky; top: 0; height: 100vh; z-index: 40;
    display: flex; flex-direction: column; background: var(--sidebar); color: #fff;
    transition: width .3s ease;
  }
  .logobar { background: #2563EB; padding: 8px; display: flex; align-items: center; justify-content: center; height: 56px; flex: none; }
  .logobar img { height: 40px; width: auto; display: block; }
  .search { position: relative; padding: 12px 12px 8px; flex: none; }
  .search svg { position: absolute; left: 24px; top: 50%; transform: translateY(-30%); color: #94A3B8; pointer-events: none; }
  .search input {
    width: 100%; border-radius: 6px; border: 1px solid var(--slate-500); background: var(--sidebar);
    padding: 7px 12px 7px 36px; font-size: 14px; color: #fff; opacity: .55; cursor: not-allowed;
  }
  .search input::placeholder { color: #94A3B8; }
  .menu { list-style: none; margin: 0; padding: 0; flex: 1; overflow-y: auto; }
  .item {
    display: flex; align-items: center; width: 100%; padding: 8px 12px; gap: 0;
    background: none; border: 0; color: #fff; text-align: left; font-size: 14px; line-height: 15px;
  }
  .item .ic { flex: none; padding: 8px; border-radius: 6px; background: var(--slate-500); margin-right: 12px; display: flex; }
  .item .ic svg { width: 18px; height: 18px; display: block; }
  .item .lb { flex: 1; min-width: 0; }
  .item .chev { flex: none; font-size: 10px; margin-left: 8px; display: flex; transition: transform .2s ease; }
  .tag { flex: none; border-radius: 999px; padding: 2px 8px; font-size: 10px; font-weight: 700; color: #000; white-space: nowrap; margin-left: 6px; }
  .tag.new { background: var(--new); }
  .tag.soon { background: var(--rbm-green); }
  /* RBM's own sections: shown for context, not part of this test */
  .item.off, .subitem.off { opacity: .4; cursor: not-allowed; }
  /* the open section: icon and label on one #0458F8 band, as RBM marks its current page */
  .item.on { cursor: pointer; }
  .item.on .ic { background: var(--active); border-radius: 6px 0 0 6px; margin-right: 0; }
  .item.on .lb { background: var(--active); align-self: stretch; display: flex; align-items: center; padding: 0 12px; border-radius: 0 6px 6px 0; }
  .item.on .chev { display: none; }
  .item.on:focus-visible, .subitem:focus-visible { outline: 2px solid #93C5FD; outline-offset: -2px; }
  .grp[aria-expanded="false"] .sub { display: none; }
  .sub { list-style: none; margin: 2px 0 8px; padding: 0 12px 0 58px; }
  .subitem {
    display: flex; align-items: center; width: 100%; padding: 7px 10px; border: 0; border-radius: 6px;
    background: none; color: #CBD5E1; font-size: 13px; text-align: left;
  }
  button.subitem { cursor: pointer; }
  button.subitem:hover { color: #B4D966; }
  .subitem[aria-current="page"] { color: #fff; font-weight: 700; background: rgba(255,255,255,.08); box-shadow: inset 3px 0 0 #60A5FA; }
  .subitem .lb { flex: 1; }
  .contact { flex: none; border-top: 1px solid #6B7280; background: var(--sidebar); padding: 8px; }
  .contact h3 { margin: 0; display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; }
  .contact p { margin: 8px 0 0; max-width: 234px; font-size: 12px; line-height: 1.25; color: #6B7280; }
  .contact span { color: #3B82F6; }

  .app.collapsed .side { width: 60px; }
  .app.collapsed .logobar .word, .app.collapsed .search, .app.collapsed .item .lb, .app.collapsed .item .tag,
  .app.collapsed .item .chev, .app.collapsed .sub, .app.collapsed .contact p { display: none; }
  .app.collapsed .logobar img { height: 36px; }
  .app.collapsed .item .ic { margin-right: 0; border-radius: 6px; }

  /* ---------- main column: transparent header over the photo hero ---------- */
  /* One screen tall, with the frame filling what the hero leaves, as RBM sizes
     the WHO Malaria Threats Map's frame on its live site (flex-1, min-h-0, at
     least 480px): the dashboard scrolls inside the frame, not the page around
     it. A frame taller than the screen (this page used 2400px until 7 Oct)
     puts the dashboard's Send feedback button, which is fixed to the frame,
     below the screen, and opens its dialog out of view. dvh, where supported,
     so a phone's browser bar does not cover the bottom of the frame. */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .hero {
    flex: none;
    position: relative; color: #fff;
    background: linear-gradient(rgba(15,23,42,.25), rgba(15,23,42,.25)), url("rbm-shell/bg-programmatic-min.webp") center top / cover #1E3A8A;
  }
  .top {
    height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border-bottom: 1px solid #2563EB; padding: 0 0 0 4px;
  }
  .top .l, .top .r { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .icbtn { background: none; border: 0; color: #fff; padding: 6px; cursor: pointer; display: flex; border-radius: 999px; }
  .icbtn svg { transition: transform .3s ease; }
  .app.collapsed .icbtn svg { transform: rotate(180deg); }
  .icbtn:focus-visible, .lang:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .howto { display: flex; align-items: center; gap: 8px; height: 26px; padding: 4px 16px 4px 4px; background: #0891B2; color: #fff; font-size: 14px; opacity: .55; cursor: not-allowed; white-space: nowrap; }
  .gap { display: flex; align-items: center; gap: 8px; height: 26px; width: 190px; padding: 0 12px 0 8px; border-radius: 999px; background: var(--rbm-blue); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .02em; opacity: .55; cursor: not-allowed; white-space: nowrap; }
  .gap span { flex: 1; text-align: center; }
  .lang { background: transparent; color: #fff; font-size: 11px; border: 1px solid #fff; border-radius: 8px; padding: 4px 6px; margin-right: 8px; cursor: pointer; }
  .lang option { color: #111827; }
  .unops { height: 40px; width: auto; margin-right: 16px; display: block; }
  .hero-in { max-width: 1600px; padding: 40px 24px 44px; }
  .micro { margin: 0 0 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: #DBEAFE; }
  .hero h1 { margin: 0; font: 700 clamp(28px, 4vw, 48px)/1.1 Poppins, Roboto, Arial, sans-serif; }

  .frame { flex: 1 1 auto; min-height: 480px; display: flex; flex-direction: column; padding: 24px; }
  .frame iframe { display: block; flex: 1 1 auto; min-height: 0; width: 100%; border: 0; background: var(--canvas); }

  /* ---------- phone: the sidebar becomes a drawer ---------- */
  .scrim { display: none; }
  @media (max-width: 767px) {
    .side { position: fixed; inset: 0 auto 0 0; transform: translateX(-100%); transition: transform .3s ease; box-shadow: 0 25px 50px -12px rgba(0,0,0,.25); }
    .app.menu-open .side { transform: none; }
    .app.menu-open .scrim { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.5); }
    .app.collapsed .side { width: 270px; }
    .howto, .gap { display: none; }
    .unops { margin-right: 8px; height: 32px; }
    .frame { padding: 12px 0; }
    .hero-in { padding: 28px 16px 32px; }
  }
  /* ---------- short screens (a phone held sideways): the hero's title goes,
     so the frame keeps the screen and the page does not scroll around it ---------- */
  @media (max-height: 560px) {
    .hero-in { display: none; }
    .frame { min-height: 0; padding: 8px 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .side, .icbtn svg, .item .chev { transition: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="side" id="side" aria-label="RBM">
    <div class="logobar">
      <img src="rbm-shell/brand.webp" alt="RBM" width="40" height="40">
      <img class="word" src="rbm-shell/logotipo.webp" alt="" width="87" height="40">
    </div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input type="text" id="search" disabled>
    </div>
    <ul class="menu" id="menu"></ul>
    <div class="contact">
      <h3><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg><span id="c-h" style="color:#fff"></span></h3>
      <p><span id="c-t" style="color:inherit"></span> <span id="c-l"></span></p>
    </div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <section class="hero">
      <header class="top">
        <div class="l">
          <button type="button" class="icbtn" id="toggle" aria-controls="side" aria-label="Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m14 16-4-4 4-4"></path></svg>
          </button>
          <div class="howto" aria-disabled="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
            <span id="howto"></span>
          </div>
        </div>
        <div class="r">
          <div class="gap" aria-disabled="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"></path><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"></path><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></svg>
            <span>The RBM Gap Analysis</span>
          </div>
          <select class="lang" id="lang" aria-label="Language"></select>
          <img class="unops" src="rbm-shell/hosted_unops.webp" alt="Hosted by UNOPS" width="89" height="40">
        </div>
      </header>
      <div class="hero-in">
        <p class="micro" id="micro"></p>
        <h1 id="h1"></h1>
      </div>
    </section>
    <div class="frame">
      <iframe id="dash" src="en/" title="Malaria Product Launch Dashboard" loading="lazy"></iframe>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  // RBM's own labels, copied from dashboards.endmalaria.org/{en,fr,pt} on
  // 7 Oct 2026 (RBM leaves the "New" tag in English on every language). The
  // LAUNCH labels are ours: the journey's name is the page's own translated
  // title; "Pipeline", "Story" and "Coming soon" in French and Portuguese are
  // hand-written, not reviewed. RBM has no Spanish site (8 Oct 2026), so all
  // of the Spanish below is hand-written, not reviewed; its dashboard and
  // journey names are guesses at the bot's titles, to check once the bot has
  // translated the page.
  var T = {
    en: { opt: ["English", "French", "Portuguese", "Spanish"], search: "Search menu items...", howto: "How to use it",
          contact: ["Contact Us", "For errors or questions about the dashboard, contact us", "via email."],
          rbm: ["Malaria at a Glance", "Surveillance & Intelligence", "Supply & Commodities", "Country Support", "Funding, Gaps & Donors", "Campaigns & CHW", "Research & Innovation"],
          launch: "Malaria Product Launch Dashboard", journey: "Illustrated journey", pipeline: "Pipeline", story: "Story", soon: "Coming soon",
          micro: "Iframe test · mock of the RBM platform" },
    fr: { opt: ["Anglais", "Français", "Portugais", "Espagnol"], search: "Rechercher des éléments de menu...", howto: "Comment l'utiliser",
          contact: ["Contactez-nous", "Pour des erreurs ou des questions sur le tableau de bord, contactez-nous", "par e-mail."],
          rbm: ["Le paludisme en un coup d'oeil", "Surveillance & Renseignement", "Approvisionnement & Produits", "Soutien aux Pays", "Financement, Lacunes & Donateurs", "Campagnes & ASC", "Recherche & Innovation"],
          launch: "Tableau de bord de lancement de produits contre le paludisme", journey: "Parcours illustré", pipeline: "Pipeline", story: "Récit", soon: "Bientôt",
          micro: "Test iframe · maquette de la plateforme RBM" },
    pt: { opt: ["Inglês", "Francês", "Português", "Espanhol"], search: "Pesquisar itens do menu...", howto: "Como usar",
          contact: ["Contate-nos", "Para erros ou dúvidas sobre o painel, entre em contato conosco", "via e-mail."],
          rbm: ["Malária em Resumo", "Vigilância & Inteligência", "Abastecimento & Insumos", "Apoio aos Países", "Financiamento, Lacunas & Doadores", "Campanhas & ACS", "Pesquisa & Inovação"],
          launch: "Painel de lançamento de produtos para a malária", journey: "Viagem Ilustrada", pipeline: "Pipeline", story: "História", soon: "Em breve",
          micro: "Teste iframe · maquete da plataforma RBM" },
    es: { opt: ["Inglés", "Francés", "Portugués", "Español"], search: "Buscar elementos del menú...", howto: "Cómo usarlo",
          contact: ["Contáctenos", "Para errores o preguntas sobre el panel, contáctenos", "por correo electrónico."],
          rbm: ["La malaria de un vistazo", "Vigilancia & Inteligencia", "Suministro & Productos", "Apoyo a los Países", "Financiación, Brechas & Donantes", "Campañas & ACS", "Investigación & Innovación"],
          launch: "Panel de lanzamiento de productos contra la malaria", journey: "Viaje ilustrado", pipeline: "Pipeline", story: "Historia", soon: "Próximamente",
          micro: "Prueba de iframe · maqueta de la plataforma RBM" }
  };
  var LANGS = ["en", "fr", "pt", "es"];
  // lucide icons, as RBM's sidebar draws them (the rocket is ours, for LAUNCH)
  var svg = function (body) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + "</svg>"; };
  var ICON = [
    '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline>',
    '<path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"></path><path d="M4 6h.01"></path><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"></path><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"></path><path d="M12 18h.01"></path><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"></path><circle cx="12" cy="12" r="2"></circle><path d="m13.41 10.59 5.66-5.66"></path>',
    '<path d="m7.5 4.27 9 5.15"></path><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path>',
    '<circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path>',
    '<path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"></path><path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"></path><path d="m2 16 6 6"></path><circle cx="16" cy="9" r="2.9"></circle><circle cx="6" cy="5" r="3"></circle>',
    '<path d="m3 11 18-5v12L3 14v-3z"></path><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"></path>',
    '<path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"></path><path d="M8.5 2h7"></path><path d="M7 16h10"></path>'
  ];
  var ROCKET = '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path>';
  var CHEV = '<svg width="1em" height="1em" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true"><path d="M285.476 272.971L91.132 467.314c-9.373 9.373-24.569 9.373-33.941 0l-22.667-22.667c-9.357-9.357-9.375-24.522-.04-33.901L188.505 256 34.484 101.255c-9.335-9.379-9.317-24.544.04-33.901l22.667-22.667c9.373-9.373 24.569-9.373 33.941 0L285.475 239.03c9.373 9.372 9.373 24.568.001 33.941z"></path></svg>';
  var NEW = [3, 4], SUB = [1, 2, 4, 5, 6];   // which RBM items carry "New" / a submenu, as on the live site
  var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); };
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), frame = $("dash"), langSel = $("lang");
  var lang = LANGS.indexOf(location.hash.slice(1)) >= 0 ? location.hash.slice(1) : "en";
  var launchOpen = true;

  function render() {
    var t = T[lang];
    document.documentElement.lang = lang;
    langSel.innerHTML = LANGS.map(function (l, i) { return '<option value="' + l + '"' + (l === lang ? " selected" : "") + ">" + esc(t.opt[i]) + "</option>"; }).join("");
    $("search").placeholder = t.search;
    $("howto").textContent = t.howto;
    $("c-h").textContent = t.contact[0]; $("c-t").textContent = t.contact[1]; $("c-l").textContent = t.contact[2];
    $("micro").textContent = t.micro;
    $("h1").textContent = t.launch;
    frame.title = t.launch;
    var off = t.rbm.map(function (label, i) {
      return '<li><div class="item off" aria-disabled="true" title="' + esc(label) + '"><span class="ic">' + svg(ICON[i]) + '</span><span class="lb">' + esc(label) + "</span>" +
        (NEW.indexOf(i) >= 0 ? '<span class="tag new">New</span>' : "") + (SUB.indexOf(i) >= 0 ? '<span class="chev">' + CHEV + "</span>" : "") + "</div></li>";
    }).join("");
    var launch = '<li class="grp" aria-expanded="' + launchOpen + '">' +
      '<button type="button" class="item on" id="launch" aria-expanded="' + launchOpen + '" aria-controls="launch-sub" title="' + esc(t.launch) + '"><span class="ic">' + svg(ROCKET) + '</span><span class="lb">' + esc(t.launch) + "</span></button>" +
      '<ul class="sub" id="launch-sub">' +
        '<li><button type="button" class="subitem" id="journey" aria-current="page"><span class="lb">' + esc(t.journey) + "</span></button></li>" +
        '<li><div class="subitem off" aria-disabled="true"><span class="lb">' + esc(t.pipeline) + '</span><span class="tag soon">' + esc(t.soon) + "</span></div></li>" +
        '<li><div class="subitem off" aria-disabled="true"><span class="lb">' + esc(t.story) + '</span><span class="tag soon">' + esc(t.soon) + "</span></div></li>" +
      "</ul></li>";
    // LAUNCH sits first while it is the page under test; RBM will choose where it goes
    $("menu").innerHTML = launch + off;
    $("launch").addEventListener("click", function () {
      if (app.classList.contains("collapsed")) { app.classList.remove("collapsed"); launchOpen = true; }
      else launchOpen = !launchOpen;
      render();
    });
    $("journey").addEventListener("click", function () { load(); app.classList.remove("menu-open"); });
  }
  function load() { frame.src = lang + "/"; }

  langSel.addEventListener("change", function () {
    lang = langSel.value;
    history.replaceState(null, "", "#" + lang);
    render(); load();
  });
  var phone = matchMedia("(max-width: 767px)");
  $("toggle").addEventListener("click", function () {
    if (phone.matches) app.classList.toggle("menu-open");
    else app.classList.toggle("collapsed");
  });
  $("scrim").addEventListener("click", function () { app.classList.remove("menu-open"); });
  addEventListener("hashchange", function () {
    var l = location.hash.slice(1);
    if (LANGS.indexOf(l) >= 0 && l !== lang) { lang = l; render(); load(); }
  });
  render();
  if (lang !== "en") load();
})();
</script>
</body>
</html>
