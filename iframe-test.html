<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAUNCH dashboard — iframe test</title>
<style>
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #16303F; background: #E9EEF1; margin: 0; padding: 20px; }
  header { max-width: 1400px; margin: 0 auto 12px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0; color: #4E6371; }
  nav { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  button { font: inherit; padding: 6px 14px; border: 1px solid #B9C7CE; border-radius: 6px; background: #fff; cursor: pointer; }
  button[aria-pressed="true"] { background: #0F5A72; color: #fff; border-color: #0F5A72; }
  .frame { max-width: 1400px; margin: 0 auto; background: #fff; border: 1px solid #B9C7CE; border-radius: 8px; overflow: hidden; }
  iframe { display: block; width: 100%; height: 2400px; border: 0; }
</style>
</head>
<body>
<header>
  <h1>Iframe test — the way the RBM platform embeds the dashboard</h1>
  <p>Each tab loads one language page in an iframe, as RBM's /en, /fr and /pt routes will.</p>
  <nav aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">/en</button>
    <button type="button" data-lang="fr" aria-pressed="false">/fr</button>
    <button type="button" data-lang="pt" aria-pressed="false">/pt</button>
  </nav>
</header>
<div class="frame">
  <iframe id="dash" src="en/" title="LAUNCH dashboard" loading="lazy"></iframe>
</div>
<script>
  document.querySelectorAll("nav button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.getElementById("dash").src = b.dataset.lang + "/";
      document.querySelectorAll("nav button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    });
  });
</script>
</body>
</html>
